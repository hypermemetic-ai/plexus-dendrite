[package]
name = "weather"
version = "0.1.0"
edition = "2021"
description = "VISION-4's foreign service: `weather.forecast { city, days }` → a stream of `day { date, rain }`, deterministic per city (or open-meteo with --live)"
license = "AGPL-3.0-only"
publish = false

# Its own workspace: an example beside the dendrite runtime.
[workspace]

[[bin]]
name = "weather"
path = "src/main.rs"

[dependencies]
# The plexus 0.7 line from crates.io (as plexus-wire's echo-rs).
plexus-core = "0.7"
plexus-macros = "0.7"
plexus-transport = { version = "0.6", default-features = false }
tokio = { version = "1", features = ["full"] }
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
# --live: open-meteo over https
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
